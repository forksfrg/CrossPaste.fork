# AnsiRover canonical build/publication definition (generated by ansirover-compose-bootstrap).
# One service = one image. Verify build.context and dockerfile before first publish.
# IMAGE_TAG is supplied by ansirover-compose-build-push from the source Git short HEAD.
services:
  crosspaste:
    image: cr.umapps.net/umapps/crosspastito:${IMAGE_TAG:-beta}
    build:
      context: ..
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
